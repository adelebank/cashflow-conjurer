name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: hashFiles('package.json') != ''
        with:
          node-version: 20
          cache: npm

      # Vite project: build into dist/
      - name: Build
        if: hashFiles('package.json') != ''
        run: |
          npm ci
          npm run build -- --base=/${{ github.event.repository.name }}/

      # No build step yet: publish the static index.html as-is
      - name: Stage static site
        if: hashFiles('package.json') == ''
        run: |
          mkdir -p dist
          cp index.html dist/
          if [ -f mod.html ]; then cp mod.html dist/; fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
